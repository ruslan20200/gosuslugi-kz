<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Kaspi.kz</title>    

    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kaspi.kz" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        min-height: 100dvh;
        margin: 0;
        background: #ffffff;
      }

      .app-launch-screen {
        width: 100%;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        background: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .app-launch-shell {
        width: 100%;
        max-width: 430px;
        min-height: 100dvh;
        padding: max(env(safe-area-inset-top), 12px) 16px 96px;
        box-sizing: border-box;
        background: #ffffff;
      }

      .app-launch-title {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-size: 17px;
        font-weight: 600;
      }

      .app-launch-tabs,
      .app-launch-search,
      .app-launch-card,
      .app-launch-row {
        background: #f2f2f7;
        border-radius: 12px;
      }

      .app-launch-tabs {
        height: 37px;
        margin-top: 0;
      }

      .app-launch-search {
        height: 42px;
        margin-top: 20px;
      }

      .app-launch-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 32px;
      }

      .app-launch-card {
        height: 128px;
        border-radius: 16px;
      }

      .app-launch-row {
        height: 54px;
        margin-top: 20px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-launch-screen" aria-hidden="true">
        <div class="app-launch-shell">
          <div class="app-launch-title">Госуслуги</div>
          <div class="app-launch-tabs"></div>
          <div class="app-launch-search"></div>
          <div class="app-launch-grid">
            <div class="app-launch-card"></div>
            <div class="app-launch-card"></div>
          </div>
          <div class="app-launch-row"></div>
          <div class="app-launch-row"></div>
          <div class="app-launch-row"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const siteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && siteId) {
        const script = document.createElement("script");
        script.defer = true;
        script.src = `${endpoint.replace(/\/$/, "")}/umami`;
        script.dataset.websiteId = siteId;
        document.head.appendChild(script);
      }
    </script>
  </body>

</html>
